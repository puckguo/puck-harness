<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>puck · web</title>
<style>
:root {
	--bg: #0e1116;
	--bg-panel: #161b23;
	--bg-input: #11151c;
	--fg: #d7dde6;
	--fg-dim: #7d8590;
	--accent: #37c2d4;
	--user: #4ec9d4;
	--think: #8a929c;
	--command: #d678d8;
	--path: #6cb2ff;
	--ok: #5fb878;
	--err: #e06c6c;
	--border: #232a35;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
	margin: 0;
	background: var(--bg);
	color: var(--fg);
	font: 14px/1.55 ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
	display: flex;
	flex-direction: column;
}
header {
	display: flex;
	align-items: center;
	gap: 12px;
	padding: 8px 14px;
	background: var(--bg-panel);
	border-bottom: 1px solid var(--border);
	flex: none;
}
header .logo { color: var(--accent); font-weight: 700; }
header .model { color: var(--user); cursor: pointer; }
header .model:hover { text-decoration: underline; }
header .spacer { flex: 1; }
header button {
	background: none;
	border: 1px solid var(--border);
	color: var(--fg-dim);
	font: inherit;
	padding: 3px 10px;
	border-radius: 4px;
	cursor: pointer;
}
header button:hover { color: var(--fg); border-color: var(--fg-dim); }

#stream {
	flex: 1;
	overflow-y: auto;
	padding: 14px 18px 8px;
}
.block { margin: 0 0 10px; white-space: pre-wrap; word-break: break-word; }
.you { color: var(--user); }
.you::before { content: "you › "; opacity: .8; }
.think { color: var(--think); font-style: italic; }
.text { }
.sys { color: var(--fg); }
.dim { color: var(--fg-dim); }
.help { color: var(--fg-dim); }
.help div { white-space: pre; }
.tool-line { color: var(--fg-dim); }
.tool-line .name { color: var(--fg); }
.tool-line .cmd { color: var(--command); }
.tool-line .pth { color: var(--path); }
.tool-line .diff-del { color: var(--err); }
.tool-line .diff-add { color: var(--ok); }
.tool-fold {
	color: var(--fg-dim);
	border-left: 2px solid var(--border);
	padding-left: 8px;
	margin: 2px 0 2px 12px;
	font-size: 12px;
	white-space: pre-wrap;
}
.tool-ok { color: var(--ok); }
.tool-err { color: var(--err); }
.stats { color: var(--fg-dim); font-size: 12px; margin: 4px 0 12px; }
.divider { color: var(--border); margin: 14px 0; }
.srv { color: var(--err); }
.spinner-line { color: var(--fg-dim); margin: 4px 0; }
.spinner-line .spin-glyph { color: var(--accent); }
.sep { height: 6px; }

#chrome {
	flex: none;
	background: var(--bg-panel);
	border-top: 1px solid var(--border);
}
#summary {
	padding: 3px 14px 0;
	color: var(--fg-dim);
	font-size: 12px;
	min-height: 18px;
	white-space: pre-wrap;
	max-height: 40px;
	overflow: hidden;
}
#trail {
	padding: 0 14px 3px;
	color: var(--fg-dim);
	font-size: 12px;
	min-height: 18px;
	white-space: nowrap;
	overflow: hidden;
	text-overflow: ellipsis;
}
#trail .trail-mark { color: var(--accent); }
#trail .trail-new { color: var(--path); }
#trail .trail-old { color: var(--fg-dim); }
#trail .trail-sep { color: var(--border); }
#statusbar {
	display: flex;
	gap: 16px;
	padding: 4px 14px;
	color: var(--fg-dim);
	font-size: 12px;
	border-top: 1px solid var(--border);
}
#statusbar .model { color: var(--user); }
#statusbar .ctx.warn { color: #d8b35a; }
#statusbar .ctx.hot { color: var(--err); }

#composer {
	flex: none;
	display: flex;
	gap: 8px;
	padding: 10px 14px 12px;
	background: var(--bg-panel);
	position: relative;
}
#input {
	flex: 1;
	background: var(--bg-input);
	border: 1px solid var(--border);
	border-radius: 6px;
	color: var(--fg);
	font: inherit;
	padding: 8px 10px;
	resize: none;
	min-height: 40px;
	max-height: 160px;
	outline: none;
}
#input:focus { border-color: var(--accent); }
#send, #abort {
	border: none;
	border-radius: 6px;
	padding: 8px 16px;
	font: inherit;
	cursor: pointer;
}
#send { background: var(--accent); color: #06222a; font-weight: 700; }
#send:disabled { opacity: .4; cursor: default; }
#abort { background: var(--border); color: var(--fg); display: none; }

#popup {
	position: fixed;
	background: var(--bg-panel);
	border: 1px solid var(--border);
	border-radius: 6px;
	padding: 6px;
	z-index: 60;
	box-shadow: 0 8px 30px rgba(0,0,0,.5);
}
.popup-row { display: flex; gap: 4px; padding: 2px 6px; border-radius: 3px; white-space: pre; }
.popup-row.sel { background: #1d242f; }
.popup-mark { color: var(--user); }
.popup-label { color: var(--fg); }
.popup-desc { color: var(--fg-dim); }
.popup-sep { color: var(--border); margin-top: 4px; }

#modal {
	position: fixed;
	inset: 0;
	background: rgba(6, 8, 12, .75);
	display: none;
	align-items: center;
	justify-content: center;
	z-index: 50;
}
#modal.open { display: flex; }
#modal .card {
	background: var(--bg-panel);
	border: 1px solid var(--border);
	border-radius: 8px;
	width: min(560px, 92vw);
	max-height: 80vh;
	overflow-y: auto;
	padding: 14px 16px;
}
#modal h3 { margin: 0 0 10px; font-size: 15px; }
#modal .item {
	display: flex;
	justify-content: space-between;
	gap: 10px;
	padding: 5px 8px;
	border-radius: 4px;
	cursor: pointer;
}
#modal .item:hover, #modal .item.sel { background: #1d242f; }
#modal .item .id { color: var(--user); }
#modal .item .meta { color: var(--fg-dim); font-size: 12px; }
#modal .item .meta.ok { color: var(--ok); }
#modal .row { display: flex; gap: 8px; margin: 10px 0; }
#modal input {
	flex: 1;
	background: var(--bg-input);
	border: 1px solid var(--border);
	border-radius: 4px;
	color: var(--fg);
	font: inherit;
	padding: 6px 8px;
}
#modal .hint { color: var(--fg-dim); font-size: 12px; }
#modal .group { margin: 8px 0 4px; }
#modal .group-head {
	display: flex;
	justify-content: space-between;
	padding: 4px 8px;
	border-bottom: 1px solid var(--border);
	margin-bottom: 2px;
}
#modal .group-head .group-name { color: var(--user); font-weight: 600; }
#modal .item.action .id { color: var(--fg-dim); }
#modal .hint.pad { padding: 2px 8px 4px; }
#modal .hint.warn { color: #d8b35a; padding: 2px 0 6px; }
#modal .manual { display: flex; gap: 8px; margin: 12px 0 4px; padding-top: 10px; border-top: 1px solid var(--border); }
#modal .manual input {
	flex: 1;
	background: var(--bg-input);
	border: 1px solid var(--border);
	border-radius: 4px;
	color: var(--fg);
	font: inherit;
	padding: 6px 8px;
	outline: none;
}
#modal .manual input:focus { border-color: var(--accent); }
#modal .manual button {
	background: var(--accent);
	border: none;
	border-radius: 4px;
	color: #06222a;
	font: inherit;
	font-weight: 700;
	padding: 6px 14px;
	cursor: pointer;
}
</style>
</head>
<body>
<header>
	<span class="logo">puck</span>
	<span class="model" id="model" title="切换模型">…</span>
	<span class="spacer"></span>
	<button id="new">新会话</button>
	<button id="resume">历史</button>
</header>

<div id="stream"></div>

<div id="chrome">
	<div id="summary"></div>
	<div id="trail"></div>
	<div id="statusbar">
		<span id="cwd"></span>
		<span id="tok"></span>
		<span id="ctx" class="ctx"></span>
		<span class="model" id="model2"></span>
	</div>
</div>

<div id="composer">
	<textarea id="input" placeholder="问点什么… (Enter 发送 · Shift+Enter 换行 · / 命令)" rows="1"></textarea>
	<button id="send">发送</button>
	<button id="abort">停止</button>
</div>

<div id="modal"><div class="card" id="modal-card"></div></div>

<script type="module" src="./app.js"></script>
</body>
</html>
